services:
  postgres:
    image: postgres:16
    shm_size: "1gb"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-surveillance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-surveillance}"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lfu"]

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KALSHI_RAW_BACKEND: postgres
      KALSHI_BOOK_MARKET_LIMIT: ${KALSHI_BOOK_MARKET_LIMIT:-5}
      KALSHI_WS_WORKER_COUNT: ${KALSHI_WS_WORKER_COUNT:-1}
      KALSHI_WS_QUEUE_SIZE: ${KALSHI_WS_QUEUE_SIZE:-2500}
      RETENTION_BOOK_EVENTS_MAX_AGE_DAYS: ${RETENTION_BOOK_EVENTS_MAX_AGE_DAYS:-1}
      RETENTION_SNAPSHOT_OBSERVE_MAX_AGE_DAYS: ${RETENTION_SNAPSHOT_OBSERVE_MAX_AGE_DAYS:-1}
      RETENTION_SNAPSHOT_SAMPLED_MAX_AGE_DAYS: ${RETENTION_SNAPSHOT_SAMPLED_MAX_AGE_DAYS:-3}
      RETENTION_SNAPSHOT_HOT_MAX_AGE_DAYS: ${RETENTION_SNAPSHOT_HOT_MAX_AGE_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

  pipeline:
    build: .
    restart: unless-stopped
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KALSHI_RAW_BACKEND: postgres
      KALSHI_BOOK_MARKET_LIMIT: ${KALSHI_BOOK_MARKET_LIMIT:-5}
      KALSHI_WS_WORKER_COUNT: ${KALSHI_WS_WORKER_COUNT:-1}
      KALSHI_WS_QUEUE_SIZE: ${KALSHI_WS_QUEUE_SIZE:-2500}
      KALSHI_WS_TICKER_BATCH_DB_WRITES_ENABLED: ${KALSHI_WS_TICKER_BATCH_DB_WRITES_ENABLED:-1}
      KALSHI_WS_TICKER_METRICS_WRITE_GATE_ENABLED: ${KALSHI_WS_TICKER_METRICS_WRITE_GATE_ENABLED:-1}
      KALSHI_WS_TICKER_METRICS_MIN_INTERVAL_SEC: ${KALSHI_WS_TICKER_METRICS_MIN_INTERVAL_SEC:-5}
      KALSHI_WS_TICKER_KNOWN_MARKET_GATE_ENABLED: ${KALSHI_WS_TICKER_KNOWN_MARKET_GATE_ENABLED:-1}
      KALSHI_WS_TICKER_KNOWN_MARKET_REFRESH_SEC: ${KALSHI_WS_TICKER_KNOWN_MARKET_REFRESH_SEC:-300}
      KALSHI_CHART_HISTORY_ENABLED: ${KALSHI_CHART_HISTORY_ENABLED:-1}
      KALSHI_WS_TICKER_SNAPSHOTS_ENABLED: ${KALSHI_WS_TICKER_SNAPSHOTS_ENABLED:-0}
      KALSHI_POLLER_QUOTE_SNAPSHOTS_ENABLED: ${KALSHI_POLLER_QUOTE_SNAPSHOTS_ENABLED:-0}
      KALSHI_REST_RETRY_MAX_ATTEMPTS: ${KALSHI_REST_RETRY_MAX_ATTEMPTS:-3}
      KALSHI_REST_RETRY_BACKOFF_SEC: ${KALSHI_REST_RETRY_BACKOFF_SEC:-1}
      KALSHI_REST_PAGE_SLEEP_SEC: ${KALSHI_REST_PAGE_SLEEP_SEC:-0.05}
    command:
      - python
      - -m
      - scripts.run_pipeline
      - --skip-api
      - --no-gdelt
      - --poll-interval-seconds
      - "900"
      - --poll-batch-size
      - "100"
      - --anomaly-market-limit
      - "50"
      - --hydrate-unknown-max
      - "100"
      - --poll-error-backoff-seconds
      - "300"
      - --news-interval-seconds
      - "3600"
      - --news-lookback-hours
      - "72"
      - --news-limit
      - "200"
      - --news-max-markets
      - "8000"
      - --news-max-profiles
      - "8000"
      - --max-candidates-per-article
      - "50"
      - --max-news-events
      - "500"
      - --news-batch-size
      - "50"
      - --with-retention-maintenance
      - --retention-execute
      - --retention-interval-seconds
      - "450"
      - --retention-book-event-days
      - "1"
      - --retention-observe-snapshot-days
      - "1"
      - --retention-sampled-snapshot-days
      - "3"
      - --retention-hot-snapshot-days
      - "14"
      - --retention-batch-size
      - "2500"
      - --retention-max-batches
      - "60"
      - --retention-allow-uncovered-snapshot-delete
      - --retention-with-trade-retention
      - --retention-trade-observe-days-after-close
      - "1"
      - --retention-trade-sampled-days-after-close
      - "14"
      - --retention-trade-hot-days-after-close
      - "30"
      - --retention-trade-triggered-days-after-close
      - "90"
      - --retention-trade-case-days-after-close
      - "365"
      - --with-anomaly-retention
      - --anomaly-retention-execute
      - --anomaly-retention-analyze
      - --anomaly-retention-interval-seconds
      - "21600"
      - --anomaly-retention-cutoff-days
      - "7"
      - --anomaly-retention-severities
      - none,low
      - --anomaly-retention-batch-size
      - "5000"
      - --anomaly-retention-max-batches
      - "20"
      - --anomaly-retention-evidence-min-score
      - "50"
      - --with-chart-history-compaction
      - --chart-history-compaction-execute
      - --chart-history-compaction-replace-source-rows
      - --chart-history-compaction-interval-seconds
      - "21600"
      - --chart-history-compaction-grace-days-after-close
      - "7"
      - --chart-history-compaction-policies
      - "300:3600:7,3600:86400:180"
      - --chart-history-active-retention-policies
      - "300:3600:14,3600:86400:180"
      - --chart-history-compaction-max-markets
      - "250"
      - --with-dashboard-cache-warmer
      - --dashboard-cache-warm-interval-seconds
      - "240"
      - --dashboard-cache-warm-market-scopes
      - active
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
