name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test And Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surveillance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d surveillance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      APP_ENV: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: surveillance_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      KALSHI_API_KEY_ID: ""
      KALSHI_PRIVATE_KEY_PATH: ""
      KALSHI_PRIVATE_KEY_PEM: ""
      CLICKHOUSE_URL: ""
      OPENSEARCH_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Unit Tests
        run: >
          python -m pytest tests
          --ignore=tests/test_migrations_integration.py
          --ignore=tests/test_dashboard_api.py

      - name: Run Database Smoke Tests
        env:
          RUN_INTEGRATION: "1"
        run: >
          python -m pytest
          tests/test_migrations_integration.py
          tests/test_dashboard_api.py

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy To EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - production
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Pull, Migrate, And Restart
        run: |
          set -euo pipefail
          cd ~/predictionmarkets
          if [ -e docker-compose.tunnel.yml ] && ! git ls-files --error-unmatch docker-compose.tunnel.yml >/dev/null 2>&1; then
            backup="$HOME/docker-compose.tunnel.yml.ec2-untracked.$(date -u +%Y%m%d%H%M%S)"
            mv docker-compose.tunnel.yml "$backup"
            echo "Backed up untracked docker-compose.tunnel.yml to $backup"
          fi
          git pull --ff-only origin main
          docker compose -f docker-compose.budget.yml build app pipeline
          docker compose -f docker-compose.budget.yml run --rm app python -m alembic upgrade head
          # Clean up stale named containers/orphans from interrupted prior runs so
          # compose can recreate app/pipeline without name conflicts.
          docker compose -f docker-compose.budget.yml rm -f app pipeline || true
          docker compose -f docker-compose.budget.yml down --remove-orphans || true
          docker rm -f predictionmarkets-app-1 predictionmarkets-pipeline-1 >/dev/null 2>&1 || true
          docker compose -f docker-compose.budget.yml up -d app pipeline
          docker compose -f docker-compose.budget.yml ps
