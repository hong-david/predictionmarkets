services:
  postgres:
    image: postgres:16
    container_name: predictionmarkets-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: surveillance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: predictionmarkets-redis
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: predictionmarkets-clickhouse
    environment:
      CLICKHOUSE_DB: surveillance
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: predictionmarkets-opensearch
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

volumes:
  postgres_data:
  clickhouse_data:
  opensearch_data:
