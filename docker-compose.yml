services:
  postgres:
    image: postgres:16
    container_name: predictionmarkets-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: surveillance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: predictionmarkets-redis
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: predictionmarkets-clickhouse
    environment:
      CLICKHOUSE_DB: surveillance
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  postgres_data:
  clickhouse_data:
